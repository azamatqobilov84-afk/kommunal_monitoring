# Fly.io konfiguratsiya fayli — NAMUNA
# `flyctl launch --no-deploy` buyrug'i ishga tushirilgandan keyin
# bu fayl avtomatik yaratiladi va sozlanadi.
#
# Agar qo'lda yaratayotgan bo'lsangiz, `app` qatoridagi nomni
# o'zingizning Fly.io app nomingizga almashtiring (unique bo'lishi shart).

app = "kommunal-monitoring"
primary_region = "fra"  # Frankfurt - Toshkentga eng yaqin Fly.io regioni

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # MUHIM: bu sozlama loyihangiz uxlamasligini ta'minlaydi
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# SQLite va media fayllari uchun doimiy disk
[[mounts]]
  source = "kommunal_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[services.ports]]
  port = 80
  handlers = ["http"]
  force_https = true

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]
