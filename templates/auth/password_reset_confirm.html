{% extends 'base.html' %}
{% block title %}Yangi parol{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1><i class="bi bi-shield-lock text-primary"></i> Yangi parol</h1>
    <p class="subtitle"><strong>{{ phone }}</strong> raqamiga yuborilgan kodni kiriting va yangi parol o'rnating.</p>
    <div class="alert alert-info small">
      <i class="bi bi-info-circle"></i> Kod terminal/konsolda chop etildi (mock rejim).
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">{{ form.code.label }}</label>
        {{ form.code }}
      </div>
      <div class="mb-3">
        <label class="form-label">{{ form.new_password.label }}</label>
        {{ form.new_password }}
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Parolni yangilash</button>
    </form>
  </div>
</div>
{% endblock %}
